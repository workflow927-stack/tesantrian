<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrian Walk-In Promotor - UFO Kebonsari</title>
    <!-- Favicon Fix -->
    <link rel="shortcut icon" href="#">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --success: #059669;
            --success-light: #d1fae5;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --purple-cs: #7c3aed;
            --purple-light: #f3e8ff;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        *, body, button, select, input {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            box-sizing: border-box;
        }

        body { 
            background: var(--bg-gradient); 
            color: var(--text-main);
            margin: 0; padding: 20px 16px;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 480px;
            background: var(--card-bg);
            border-radius: 28px; padding: 24px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: var(--shadow-md);
            text-align: center;
            height: fit-content;
        }

        .gradient-header {
            background: linear-gradient(135deg, #312e81 0%, #4f46e5 100%);
            border-radius: 20px; padding: 24px 20px; color: white; margin-bottom: 20px;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            position: relative; overflow: hidden;
        }
        .gradient-header::after {
            content: ''; position: absolute; top: -50px; right: -50px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%; pointer-events: none;
        }
        .gradient-header h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .gradient-header p { margin: 6px 0 0 0; opacity: 0.9; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }

        .status-badge-sistem {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 18px; border-radius: 30px;
            font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px;
            letter-spacing: 0.8px; box-shadow: var(--shadow-sm);
        }
        .status-open { background: var(--success-light); color: var(--success); border: 1px solid #6ee7b7; }
        .status-closed { background: var(--danger-light); color: var(--danger); border: 1px solid #fca5a5; }

        .card-giliran-wrapper {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
        }
        .card-giliran-utama {
            background: #f8fafc; border: 1px solid var(--border);
            border-radius: 18px; padding: 16px 12px; text-align: center;
            box-shadow: var(--shadow-sm); transition: transform 0.2s ease;
        }
        .card-giliran-utama:hover { transform: translateY(-2px); }
        .label-giliran { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .nama-giliran-aktif { font-size: 16px; font-weight: 800; color: var(--primary); margin: 8px 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .timer-mundur { 
            font-size: 14px; font-weight: 800; display: block; 
            font-variant-numeric: tabular-nums; color: var(--text-muted);
        }
        .timer-warning-merah { color: var(--danger) !important; animation: blinkAlert 1s infinite; }
        @keyframes blinkAlert { 50% { opacity: 0.3; } }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }

        select, input[type="text"] { 
            width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--border);
            background: #f8fafc; font-size: 14px; font-weight: 700; color: var(--text-main); outline: none;
            transition: all 0.2s ease; box-shadow: var(--shadow-sm);
        }
        select:focus, input[type="text"]:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        select:disabled { background-color: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

        button { 
            width: 100%; padding: 16px; border-radius: 14px; 
            font-size: 14px; font-weight: 800; cursor: pointer; border: none;
            text-transform: uppercase; transition: all 0.2s ease;
            display: inline-flex; justify-content: center; align-items: center; gap: 10px;
            letter-spacing: 0.8px; box-shadow: var(--shadow-sm);
        }
        button:active { transform: scale(0.98); }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #047857; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-purple { background: var(--purple-cs); color: white; }
        .btn-purple:hover { background: #6d28d9; }
        .btn-cancel { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }
        .btn-disabled { background: #e2e8f0 !important; color: #94a3b8 !important; cursor: not-allowed !important; box-shadow: none !important; }

        .spinner {
            width: 18px; height: 18px; border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; border-top-color: #ffffff; animation: spin 0.8s linear infinite; display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .user-badge {
            background: #f8fafc; border: 1px solid var(--border); border-radius: 16px;
            padding: 14px 18px; margin-bottom: 16px; text-align: left; font-size: 13px; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm);
        }

        .list-container-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 24px; text-align: left; }
        .list-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 12px; box-shadow: var(--shadow-sm); }
        .list-box-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; display: block; text-align: center; }
        
        .list-antrian { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
        .list-antrian::-webkit-scrollbar { width: 4px; }
        .list-antrian::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .list-antrian li {
            padding: 10px 10px; background: #ffffff; border-radius: 10px; margin-bottom: 6px;
            display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--border); font-size: 12px; font-weight: 700;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .list-item-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }

        .badge-status-item { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 6px; white-space: nowrap; text-transform: uppercase; }
        .badge-standby { background: var(--primary-light); color: var(--primary); border: 1px solid #c7d2fe; }
        .badge-melayani { background: var(--warning-light); color: var(--warning); border: 1px solid #fde68a; }
        .badge-cs { background: var(--purple-light); color: var(--purple-cs); border: 1px solid #d8b4fe; }

        .wa-report-btn {
            margin-top: 20px; background: #10b981; border: none; color: white;
            font-size: 12px; padding: 14px; border-radius: 14px; text-decoration: none; 
            display: flex; justify-content: center; align-items: center; gap: 8px; font-weight: 800;
            letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); transition: background 0.2s;
        }
        .wa-report-btn:hover { background: #059669; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.25s ease; padding: 16px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; width: 100%; max-width: 340px; padding: 24px; border-radius: 22px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-md); transform: scale(0.95); transition: transform 0.25s ease; }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; color: var(--text-main); }
        .modal-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; font-weight: 600; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 12px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- TOMBOL LAPOR KECURANGAN VIA WHATSAPP -->

    <!-- MODAL POPUP -->
    <div id="custom-modal" class="modal-overlay">

                <button type="button" class="btn-primary" onclick="tutupModal()">OK</button>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYtbXMd5BFEF3fEcNlpQUKzVTH3DHYv0zVG8qTEiGbGmNU4_LlcgcRub2z3U2CaoO3/exec";

        let waktuStandbyHAGlobal = null;
        let waktuStandbyAVGlobal = null;
        let daftarAntrianGlobal = [];
        let masterSalesGlobal = [];
        let statusSayaGlobal = "belum_ada"; 
        let statusSistemGlobal = "BUKA";
        let namaSalesAktifGlobal = "";
        const BATAS_MENIT = 60;
        let sedangProsesAksi = false;

        window.onload = function() {
            muatMasterSalesInstant();
            cekAkunKeServer();
            muatMasterSales();
            setInterval(muatDataAntrian, 3000); 
            setInterval(hitungMundurLokal, 1000); 
        };

        function getDeviceId() {
            let localSalt = localStorage.getItem('ufo_device_salt');
            if (!localSalt) {
                localSalt = typeof crypto.randomUUID === 'function' 
                    ? crypto.randomUUID() 
                    : Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('ufo_device_salt', localSalt);
            }

            const nav = navigator;
            const screen = window.screen;
            
            const userAgent = nav.userAgent || "";
            const language = nav.language || "";
            const screenRes = `${screen.width}x${screen.height}x${screen.colorDepth}`;
            const hardwareConcurrency = nav.hardwareConcurrency || "unknown";
            const platform = nav.platform || "";
            const timezone = (typeof Intl !== "undefined" && Intl.DateTimeFormat) 
                        ? Intl.DateTimeFormat().resolvedOptions().timeZone || "" 
                        : "";

            let canvasData = "";
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("UFO-Kebonsari", 2, 15);
                canvasData = canvas.toDataURL();
            } catch(e) {}

            const rawFingerprint = `${localSalt}|${userAgent}|${language}|${screenRes}|${hardwareConcurrency}|${platform}|${timezone}|${canvasData.substring(0, 50)}`;

            let hash = 0;
            for (let i = 0; i < rawFingerprint.length; i++) {
                const char = rawFingerprint.charCodeAt(i);
                hash = (hash << 5) - hash + char;
                hash |= 0; 
            }

            const finalHash = Math.abs(hash).toString().padStart(9, '0').substring(0, 9);
            return "DEV-" + finalHash;
        }

        function cekAkunKeServer() {
            const deviceId = getDeviceId();
            const cachedNama = localStorage.getItem('ufo_nama_sales_aktif');
            
            if (cachedNama) {
                namaSalesAktifGlobal = cachedNama;
                document.getElementById('panel-login').style.display = 'none';
                document.getElementById('panel-menu-utama').style.display = 'block';
                document.getElementById('label-user-aktif').innerText = cachedNama;
            }

            fetch(`${SCRIPT_URL}?aksi=cekBinding&deviceId=${encodeURIComponent(deviceId)}`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                if (res.status === "terkunci" && res.nama) {
                    namaSalesAktifGlobal = res.nama;
                    localStorage.setItem('ufo_nama_sales_aktif', res.nama);
                    
                    document.getElementById('panel-login').style.display = 'none';
                    document.getElementById('panel-menu-utama').style.display = 'block';
                    document.getElementById('label-user-aktif').innerText = res.nama;
                } else if (res.status === "bebas") {
                    localStorage.removeItem('ufo_nama_sales_aktif');
                    document.getElementById('panel-login').style.display = 'block';
                    document.getElementById('panel-menu-utama').style.display = 'none';
                }
                muatDataAntrian(true);
            }).catch(() => {
                muatDataAntrian();
            });
        }

        function simpanAkunHP() {
            const namaPilih = document.getElementById('pilih-sales').value;
            const deviceId = getDeviceId();
            if(!namaPilih) return tampilkanModal("Perhatian", "Silakan pilih nama Anda!");

            tampilkanModalKonfirmasi("Kunci Perangkat", `Kunci HP ini atas nama (${namaPilih})?`, function() {
                fetch(`${SCRIPT_URL}?aksi=kunciPerangkat&namaSales=${encodeURIComponent(namaPilih)}&deviceId=${encodeURIComponent(deviceId)}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    if(res.status === "sukses") {
                        namaSalesAktifGlobal = namaPilih;
                        localStorage.setItem('ufo_nama_sales_aktif', namaPilih);
                        document.getElementById('panel-login').style.display = 'none';
                        document.getElementById('panel-menu-utama').style.display = 'block';
                        document.getElementById('label-user-aktif').innerText = namaPilih;
                        tampilkanModal("Berhasil", `HP terikat untuk: ${namaPilih}`);
                        muatDataAntrian(true);
                    } else {
                        tampilkanModal("Akses Ditolak", res.pesan);
                    }
                });
            });
        }

        function getAkunAktif() {
            if (!namaSalesAktifGlobal) {
                namaSalesAktifGlobal = localStorage.getItem('ufo_nama_sales_aktif') || "";
            }
            return namaSalesAktifGlobal;
        }

        function hitungMundurLokal() {
            const labelTimerHA = document.getElementById('timer-mundur-ha');
            const labelTimerAV = document.getElementById('timer-mundur-av');
            const now = new Date().getTime();

            if (waktuStandbyHAGlobal) {
                const waktuHA = new Date(waktuStandbyHAGlobal).getTime();
                if (!isNaN(waktuHA)) {
                    const selisihMs = now - waktuHA;
                    const sisaMs = (BATAS_MENIT * 60 * 1000) - selisihMs;
                    if (sisaMs > 0) {
                        const totalDetik = Math.floor(sisaMs / 1000);
                        const menit = Math.floor(totalDetik / 60);
                        const detik = totalDetik % 60;
                        labelTimerHA.innerText = `${menit}:${detik < 10 ? '0' : ''}${detik}`;
                        if (totalDetik <= 60) {
                            labelTimerHA.classList.add('timer-warning-merah');
                        } else {
                            labelTimerHA.classList.remove('timer-warning-merah');
                        }
                    } else {
                        labelTimerHA.innerText = `Habis!`;
                        labelTimerHA.classList.add('timer-warning-merah');
                    }
                }
            } else {
                labelTimerHA.innerText = "00:00";
                labelTimerHA.classList.remove('timer-warning-merah');
            }

            if (waktuStandbyAVGlobal) {
                const waktuAV = new Date(waktuStandbyAVGlobal).getTime();
                if (!isNaN(waktuAV)) {
                    const selisihMs = now - waktuAV;
                    const sisaMs = (BATAS_MENIT * 60 * 1000) - selisihMs;
                    if (sisaMs > 0) {
                        const totalDetik = Math.floor(sisaMs / 1000);
                        const menit = Math.floor(totalDetik / 60);
                        const detik = totalDetik % 60;
                        labelTimerAV.innerText = `${menit}:${detik < 10 ? '0' : ''}${detik}`;
                        if (totalDetik <= 60) {
                            labelTimerAV.classList.add('timer-warning-merah');
                        } else {
                            labelTimerAV.classList.remove('timer-warning-merah');
                        }
                    } else {
                        labelTimerAV.innerText = `Habis!`;
                        labelTimerAV.classList.add('timer-warning-merah');
                    }
                }
            } else {
                labelTimerAV.innerText = "00:00";
                labelTimerAV.classList.remove('timer-warning-merah');
            }
        }

        function muatMasterSalesInstant() {
            const cachedSales = localStorage.getItem('ufo_master_sales_cache');
            if (cachedSales) {
                try {
                    const dataSales = JSON.parse(cachedSales);
                    let html = '<option value="">-- Pilih Nama Anda --</option>';
                    dataSales.forEach(n => html += `<option value="${n}">${n}</option>`);
                    const selectEl = document.getElementById('pilih-sales');
                    if (selectEl) selectEl.innerHTML = html;
                } catch(e) {}
            }
        }

        function muatMasterSales() {
            fetch(`${SCRIPT_URL}?aksi=getMasterSales`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses" && res.data) {
                    localStorage.setItem('ufo_master_sales_cache', JSON.stringify(res.data));
                    let html = '<option value="">-- Pilih Nama Anda --</option>';
                    res.data.forEach(n => html += `<option value="${n}">${n}</option>`);
                    const selectEl = document.getElementById('pilih-sales');
                    if (selectEl) selectEl.innerHTML = html;
                }
            });
        }

        function renderUIRental(dataAntrian, statusSistem, waktuStandbyHA, waktuStandbyAV) {
            if (sedangProsesAksi) return;

            daftarAntrianGlobal = dataAntrian || [];
            statusSistemGlobal = statusSistem || "BUKA";
            waktuStandbyHAGlobal = waktuStandbyHA || null;
            waktuStandbyAVGlobal = waktuStandbyAV || null;
            const akunSaya = getAkunAktif().trim();

            const badge = document.getElementById('badge-status-sistem');
            badge.innerText = statusSistemGlobal === "BUKA" ? "STATUS: OPEN" : "STATUS: CLOSED";
            badge.className = statusSistemGlobal === "BUKA" ? "status-badge-sistem status-open" : "status-badge-sistem status-closed";

            let listHtmlHA = "";
            let listHtmlAV = "";
            let namaHANow = "-";
            let namaAVNow = "-";
            statusSayaGlobal = "belum_ada"; 
            let apakahSayaUrutanPertamaHA = false;
            let apakahSayaUrutanPertamaAV = false;

            let listStandby = daftarAntrianGlobal.filter(item => item.status === "Standby");
            let standbyHA = listStandby.find(item => (item.kategori || "HA") === "HA");
            let standbyAV = listStandby.find(item => item.kategori === "AV");

            if (standbyHA) {
                namaHANow = standbyHA.nama;
                if (akunSaya && standbyHA.nama.trim().toLowerCase() === akunSaya.toLowerCase()) apakahSayaUrutanPertamaHA = true;
            }
            if (standbyAV) {
                namaAVNow = standbyAV.nama;
                if (akunSaya && standbyAV.nama.trim().toLowerCase() === akunSaya.toLowerCase()) apakahSayaUrutanPertamaAV = true;
            }

            if(daftarAntrianGlobal.length > 0) {
                let urutHA = 1, urutAV = 1;
                daftarAntrianGlobal.forEach((item) => {
                    const namaItem = String(item.nama).trim();
                    const kategoriItem = item.kategori ? item.kategori : "HA"; 

                    if(akunSaya && namaItem.toLowerCase() === akunSaya.toLowerCase()) {
                        statusSayaGlobal = item.status; 
                        const selectKat = document.getElementById('pilih-kategori');
                        if (selectKat) selectKat.value = kategoriItem;
                    }

                    let itemHtml = "";
                    if (item.status === "Standby") {
                        let urut = kategoriItem === "AV" ? urutAV++ : urutHA++;
                        itemHtml = `<li>
                            <div class="list-item-top"><b>${urut}. ${item.nama}</b> <span class="badge-status-item badge-standby">Standby</span></div>
                        </li>`;
                    } else if (item.status === "Melayani") {
                        itemHtml = `<li>
                            <div class="list-item-top"><b>${item.nama}</b> <span class="badge-status-item badge-melayani">Melayani</span></div>
                        </li>`;
                    } else if (item.status === "Dipanggil CS/GUDANG" || item.status === "Dipanggil CS") {
                        let urut = kategoriItem === "AV" ? urutAV++ : urutHA++;
                        itemHtml = `<li>
                            <div class="list-item-top"><b>${urut}. ${item.nama}</b> <span class="badge-status-item badge-cs">CS/Gudang</span></div>
                        </li>`;
                    }

                    if (kategoriItem === "AV") listHtmlAV += itemHtml;
                    else listHtmlHA += itemHtml;
                });
            }

            if(!listHtmlHA) listHtmlHA = "<li><span style='color:#94a3b8; font-style:italic; font-size:11px;'>Kosong</span></li>";
            if(!listHtmlAV) listHtmlAV = "<li><span style='color:#94a3b8; font-style:italic; font-size:11px;'>Kosong</span></li>";

            const btnAntri = document.getElementById('btn-utama-antri');
            const btnCustomer = document.getElementById('btn-utama-customer');
            const btnClosing = document.getElementById('btn-selesai-closing');
            const btnCS = document.getElementById('btn-utama-cs');
            const btnKeluar = document.getElementById('btn-keluar-istirahat');
            const selectKategori = document.getElementById('pilih-kategori');

            // Reset teks dan aktifkan kembali semua tombol
            btnAntri.innerHTML = "Daftar Antrian";
            btnAntri.className = "btn-success";
            btnAntri.disabled = false;
            
            btnCustomer.innerHTML = "Sudah Membawa Customer";
            btnCustomer.className = "btn-primary";
            btnCustomer.disabled = false;
            
            btnClosing.innerHTML = "SELESAI MELAYANI (DEAL / CLOSING)";
            btnClosing.className = "btn-danger";
            btnClosing.disabled = false;
            
            btnCS.innerHTML = (statusSayaGlobal === "Dipanggil CS/GUDANG" || statusSayaGlobal === "Dipanggil CS") ? "SELESAI CS (KEMBALI ANTRI)" : "DIPANGGIL CS/GUDANG";
            btnCS.className = (statusSayaGlobal === "Dipanggil CS/GUDANG" || statusSayaGlobal === "Dipanggil CS") ? "btn-success" : "btn-purple";
            btnCS.disabled = false;
            
            btnKeluar.innerHTML = "KELUAR ANTRIAN (ISTIRAHAT)";
            btnKeluar.className = "btn-cancel";
            btnKeluar.disabled = false;

            if (statusSayaGlobal === "Melayani") {
                btnAntri.innerText = "Sedang Melayani Customer";
                btnAntri.className = "btn-warning btn-disabled";
                btnAntri.disabled = true;

                btnCustomer.style.display = "none"; 
                btnClosing.style.display = "block";
                btnCS.style.display = "none";
                btnKeluar.style.display = "none";
                selectKategori.disabled = true;
            } else if (statusSayaGlobal === "Standby") {
                btnAntri.innerText = "Anda Sudah Di Antrian";
                btnAntri.className = "btn-success btn-disabled";
                btnAntri.disabled = true;

                btnCustomer.style.display = "block";
                btnClosing.style.display = "none";
                
                let kategoriSaya = selectKategori.value;
                let bisaAmbil = (kategoriSaya === "AV" && apakahSayaUrutanPertamaAV) || (kategoriSaya !== "AV" && apakahSayaUrutanPertamaHA);
                if(!bisaAmbil) {
                    btnCustomer.className = "btn-primary btn-disabled";
                    btnCustomer.disabled = true;
                }

                btnCS.style.display = "block";
                btnKeluar.style.display = "block";
                selectKategori.disabled = true;
            } else if (statusSayaGlobal === "Dipanggil CS/GUDANG" || statusSayaGlobal === "Dipanggil CS") {
                btnAntri.innerText = "Posisi Antrian Dikunci (Di CS)";
                btnAntri.className = "btn-purple btn-disabled";
                btnAntri.disabled = true;

                btnCustomer.style.display = "none";
                btnClosing.style.display = "none";
                btnCS.style.display = "block";
                btnKeluar.style.display = "none";
                selectKategori.disabled = true;
            } else { 
                btnAntri.innerText = statusSistemGlobal === "TUTUP" ? "Antrian Ditutup SPV" : "Daftar Antrian";
                btnAntri.className = statusSistemGlobal === "TUTUP" ? "btn-danger btn-disabled" : "btn-success";
                btnAntri.disabled = (statusSistemGlobal === "TUTUP");
                btnCustomer.style.display = "none";
                btnClosing.style.display = "none";
                btnCS.style.display = "none";
                btnKeluar.style.display = "none";
                selectKategori.disabled = false;
            }

            document.getElementById('nama-aktif-ha').innerText = namaHANow;
            document.getElementById('nama-aktif-av').innerText = namaAVNow;
            document.getElementById('item-antrian-list-ha').innerHTML = listHtmlHA;
            document.getElementById('item-antrian-list-av').innerHTML = listHtmlAV;
        }

        function muatDataAntrian(paksaTarik = false) {
            if (sedangProsesAksi && !paksaTarik) return;
            fetch(`${SCRIPT_URL}?aksi=getAntrian`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                if(res && res.status === "sukses") {
                    renderUIRental(res.data, res.statusAntrian, res.waktuStandbyHA, res.waktuStandbyAV);
                }
            }).catch(() => {});
        }

        function eksekusiCepatKeServer(url, btnElement, targetStatusLokal) {
            sedangProsesAksi = true;
            statusSayaGlobal = targetStatusLokal;
            renderUIRental(daftarAntrianGlobal, statusSistemGlobal, waktuStandbyHAGlobal, waktuStandbyAVGlobal);

            fetch(url, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                sedangProsesAksi = false;
                if (res.status !== "sukses" && res.pesan) {
                    tampilkanModal("Perhatian", res.pesan);
                }
                muatDataAntrian(true);
            }).catch(() => {
                sedangProsesAksi = false;
                muatDataAntrian(true);
            });
        }

        function aksiUtamaAntri() {
            const namaSales = getAkunAktif().trim();
            const kategoriPilih = document.getElementById('pilih-kategori').value;
            if(!namaSales) return tampilkanModal("Perhatian", "Akun belum terikat dengan benar.");
            
            const btn = document.getElementById('btn-utama-antri');
            btn.disabled = true;
            btn.className = "btn-success btn-disabled";
            btn.innerHTML = `<span class="spinner"></span> Memproses...`;

            const url = `${SCRIPT_URL}?aksi=daftarAntri&namaSales=${encodeURIComponent(namaSales)}&kategori=${encodeURIComponent(kategoriPilih)}`;
            eksekusiCepatKeServer(url, btn, "Standby");
        }

        function aksiUtamaCustomer() {
            const namaSales = getAkunAktif();
            if(!namaSales) return;

            if (statusSayaGlobal === "Standby") {
                tampilkanModalKonfirmasi("Konfirmasi", "Sudah membawa customer?", function() {
                    const btn = document.getElementById('btn-utama-customer');
                    btn.disabled = true;
                    btn.className = "btn-primary btn-disabled";
                    btn.innerHTML = `<span class="spinner"></span> Memproses...`;

                    const url = `${SCRIPT_URL}?aksi=ambilAntrian&namaSales=${encodeURIComponent(namaSales)}`;
                    eksekusiCepatKeServer(url, btn, "Melayani");
                });
            }
        }

        function aksiSelesaiClosing() {
            const namaSales = getAkunAktif();
            if(!namaSales) return;

            tampilkanModalKonfirmasi("Konfirmasi Selesai", "Selesai melayani customer? Anda akan dikeluarkan dari antrian.", function() {
                const btn = document.getElementById('btn-selesai-closing');
                btn.disabled = true;
                btn.className = "btn-danger btn-disabled";
                btn.innerHTML = `<span class="spinner"></span> Memproses...`;

                const url = `${SCRIPT_URL}?aksi=selesaiMelayani&namaSales=${encodeURIComponent(namaSales)}`;
                eksekusiCepatKeServer(url, btn, "belum_ada");
            });
        }

        function aksiToggleCS() {
            const namaSales = getAkunAktif();
            if(!namaSales) return;

            const btn = document.getElementById('btn-utama-cs');

            if (statusSayaGlobal === "Standby") {
                tampilkanModalKonfirmasi("Status Dipanggil CS/GUDANG", "Dipanggil oleh CS/GUDANG? Posisi antrian Anda akan dikunci.", function() {
                    btn.disabled = true;
                    btn.className = "btn-purple btn-disabled";
                    btn.innerHTML = `<span class="spinner"></span> Memproses...`;

                    const url = `${SCRIPT_URL}?aksi=panggilCS&namaSales=${encodeURIComponent(namaSales)}`;
                    eksekusiCepatKeServer(url, btn, "Dipanggil CS/GUDANG");
                });
            } else if (statusSayaGlobal === "Dipanggil CS/GUDANG" || statusSayaGlobal === "Dipanggil CS") {
                tampilkanModalKonfirmasi("Selesai Urusan CS/GUDANG", "Urusan CS/GUDANG sudah selesai? Kembali aktif di antrian.", function() {
                    btn.disabled = true;
                    btn.className = "btn-success btn-disabled";
                    btn.innerHTML = `<span class="spinner"></span> Memproses...`;

                    const url = `${SCRIPT_URL}?aksi=selesaiCS&namaSales=${encodeURIComponent(namaSales)}`;
                    eksekusiCepatKeServer(url, btn, "Standby");
                });
            }
        }

        function bukaModalKeluarIstirahat() {
            tampilkanModalKonfirmasi("Keluar Antrian", "Apakah Anda yakin ingin keluar dari antrian untuk istirahat / ada keperluan?", function() {
                const namaSales = getAkunAktif();
                if (!namaSales) return;

                const btn = document.getElementById('btn-keluar-istirahat');
                btn.disabled = true;
                btn.className = "btn-cancel btn-disabled";
                btn.innerHTML = `<span class="spinner" style="border-top-color: #64748b;"></span> Memproses...`;

                const url = `${SCRIPT_URL}?aksi=selesaiMelayani&namaSales=${encodeURIComponent(namaSales)}`;
                eksekusiCepatKeServer(url, btn, "belum_ada");
            });
        }

        function tampilkanModal(judul, desc) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-primary" onclick="tutupModal()">OK</button>`;
            document.getElementById('custom-modal').classList.add('active');
        }

        function tampilkanModalKonfirmasi(judul, desc, callbackYa) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" class="btn-cancel" onclick="tutupModal()" style="border: 1px solid var(--border);">Batal</button>
                <button type="button" class="btn-primary" id="btn-modal-ya">Ya</button>
            `;
            document.getElementById('custom-modal').classList.add('active');
            document.getElementById('btn-modal-ya').onclick = function() { tutupModal(); callbackYa(); };
        }

        function tutupModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
    </script>
</body>
</html>
