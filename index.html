    <script>
        let daftarAntrianGlobal = [];
        let masterSalesGlobal = [];
        let statusSistemGlobal = "BUKA";
        let namaSalesAktifGlobal = "";
        let koordinatToko = { lat: null, lng: null, radius: 50 };
        let mapPromotor = null, circleTokoPeta = null, markerTokoPeta = null, markerSayaPeta = null;
        let posisiSaya = { lat: null, lng: null, ok: false };
        let timerIntervalGlobal = null;
        let masterSalesLoaded = false;

        // ====== UTIL ======
        function getTanggalIndo() {
            const now = new Date();
            return `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
        }

        function getTanggalKey() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function sanitizeNama(nama) {
            return String(nama || "").trim().toLowerCase().replace(/\s+/g, '_');
        }

        function hitungJarak(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // ====== INIT ======
        window.addEventListener('firebase-ready', () => {
            initDarkMode();
            resetCheckinHarianJikaPerlu();

            const cachedNama = localStorage.getItem('ufo_nama_sales_aktif');
            if (cachedNama) {
                namaSalesAktifGlobal = cachedNama;
                document.getElementById('panel-login').style.display = 'none';
                document.getElementById('panel-menu-utama').style.display = 'block';
                document.getElementById('label-user-aktif').innerText = cachedNama;
            } else {
                document.getElementById('panel-login').style.display = 'block';
                document.getElementById('panel-menu-utama').style.display = 'none';
            }

            inisialisasiRealtimeFirebase();
        });

        function resetCheckinHarianJikaPerlu() {
            const tglTersimpan = localStorage.getItem('ufo_checkin_tanggal');
            const hariIni = getTanggalKey();
            if (tglTersimpan !== hariIni) {
                localStorage.removeItem('ufo_checkin_hari_ini');
                localStorage.removeItem('ufo_checkin_tanggal');
                // reset jatah makan juga per hari
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('ufo_sudah_makan_')) localStorage.removeItem(key);
                });
            }
        }

        function inisialisasiRealtimeFirebase() {
            const db = window.db;

            // 1. Antrian Realtime
            window.dbOnValue(window.dbRef(db, 'antrian'), (snapshot) => {
                const dataRaw = snapshot.val();
                daftarAntrianGlobal = [];
                if (dataRaw) {
                    Object.keys(dataRaw).forEach(k => {
                        const item = dataRaw[k];
                        if (item && item.nama) {
                            item._key = k;
                            daftarAntrianGlobal.push(item);
                        }
                    });
                }
                renderUI();
            });

            // 2. Master Sales Realtime (hanya 1 path utama, fallback jika kosong)
            const pathUtama = 'mastersales';
            window.dbOnValue(window.dbRef(db, pathUtama), (snapshot) => {
                const dataRaw = snapshot.val();
                if (dataRaw) {
                    prosesMasterSales(dataRaw);
                    masterSalesLoaded = true;
                } else if (!masterSalesLoaded) {
                    // fallback ke 'data' jika mastersales kosong
                    window.dbOnValue(window.dbRef(db, 'data'), (snap2) => {
                        const d2 = snap2.val();
                        if (d2 && !masterSalesLoaded) {
                            prosesMasterSales(d2);
                            masterSalesLoaded = true;
                        }
                    });
                }
            });

            // 3. Setting Toko
            window.dbOnValue(window.dbRef(db, 'setting'), (snapshot) => {
                const setting = snapshot.val();
                if (setting) {
                    statusSistemGlobal = setting.statusAntrian || "BUKA";
                    if (setting.latToko && setting.lngToko) {
                        koordinatToko.lat = Number(setting.latToko);
                        koordinatToko.lng = Number(setting.lngToko);
                        koordinatToko.radius = Number(setting.radiusToko) || 50;
                    }
                }
                renderUI();
            });
        }

        function prosesMasterSales(dataRaw) {
            let selectHtml = '<option value="">-- Pilih Nama Anda --</option>';
            let listSales = Array.isArray(dataRaw) ? dataRaw : Object.values(dataRaw);
            let names = [];
            listSales.forEach(item => {
                let salesObj = (item && item.record) ? item.record : item;
                let nama = salesObj && (salesObj.NAMA_PROMOTOR || salesObj.nama || salesObj.Nama_Sales);
                if (nama && typeof nama === 'string' && nama.trim() !== "") {
                    names.push(nama.trim());
                }
            });
            // hilangkan duplikat
            names = [...new Set(names)].sort();
            names.forEach(n => { selectHtml += `<option value="${n}">${n}</option>`; });
            const selectEl = document.getElementById('pilih-sales');
            if (selectEl) selectEl.innerHTML = selectHtml;
        }

        // ====== PETA ======
        function initPetaPromotor() {
            if (mapPromotor) return;
            const container = document.getElementById('map-promotor');
            if (!container) return;

            if (!koordinatToko.lat || !koordinatToko.lng) {
                container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:#64748b;">Koordinat toko belum diatur admin</div>';
                return;
            }

            mapPromotor = L.map('map-promotor').setView([koordinatToko.lat, koordinatToko.lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, attribution: '© OpenStreetMap'
            }).addTo(mapPromotor);

            markerTokoPeta = L.marker([koordinatToko.lat, koordinatToko.lng]).addTo(mapPromotor).bindPopup("Lokasi Toko");
            circleTokoPeta = L.circle([koordinatToko.lat, koordinatToko.lng], {
                radius: koordinatToko.radius, color: '#059669', fillColor: '#059669', fillOpacity: 0.15
            }).addTo(mapPromotor);

            setTimeout(() => mapPromotor.invalidateSize(), 200);
            mulaiDeteksiLokasi();
        }

        function mulaiDeteksiLokasi() {
            if (!navigator.geolocation) {
                document.getElementById('info-radius').innerText = "❌ Browser tidak mendukung GPS";
                document.getElementById('info-radius').className = "info-radius err";
                return;
            }
            navigator.geolocation.watchPosition(
                (pos) => {
                    posisiSaya.lat = pos.coords.latitude;
                    posisiSaya.lng = pos.coords.longitude;
                    updatePetaLokasiSaya();
                },
                (err) => {
                    document.getElementById('info-radius').innerText = "❌ Izin lokasi ditolak / tidak tersedia";
                    document.getElementById('info-radius').className = "info-radius err";
                },
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
            );
        }

        function updatePetaLokasiSaya() {
            if (!mapPromotor || !koordinatToko.lat) return;
            const lat = posisiSaya.lat, lng = posisiSaya.lng;

            if (markerSayaPeta) mapPromotor.removeLayer(markerSayaPeta);
            markerSayaPeta = L.marker([lat, lng], {
                icon: L.divIcon({ className: '', html: '<div style="background:#dc2626;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 0 6px rgba(0,0,0,0.5);"></div>', iconSize: [16,16] })
            }).addTo(mapPromotor).bindPopup("Posisi Anda");

            const jarak = hitungJarak(lat, lng, koordinatToko.lat, koordinatToko.lng);
            const infoEl = document.getElementById('info-radius');
            const btnHadir = document.getElementById('btn-hadir');

            if (jarak <= koordinatToko.radius) {
                posisiSaya.ok = true;
                infoEl.innerText = `✅ Anda dalam radius (${Math.round(jarak)}m / max ${koordinatToko.radius}m)`;
                infoEl.className = "info-radius ok";
                if (btnHadir) { btnHadir.classList.remove('btn-disabled'); btnHadir.disabled = false; btnHadir.innerText = "Konfirmasi Kehadiran & Masuk Antri"; }
            } else {
                posisiSaya.ok = false;
                infoEl.innerText = `⚠️ Di luar radius (${Math.round(jarak)}m / max ${koordinatToko.radius}m)`;
                infoEl.className = "info-radius err";
                if (btnHadir) { btnHadir.classList.add('btn-disabled'); btnHadir.disabled = true; btnHadir.innerText = `Di Luar Radius (${Math.round(jarak)}m)`; }
            }

            const bounds = L.latLngBounds([[lat, lng], [koordinatToko.lat, koordinatToko.lng]]);
            mapPromotor.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });
        }

        // ====== AKUN ======
        function getAkunAktif() {
            if (!namaSalesAktifGlobal) namaSalesAktifGlobal = localStorage.getItem('ufo_nama_sales_aktif') || "";
            return namaSalesAktifGlobal;
        }

        function simpanAkunHP() {
            const namaPilih = document.getElementById('pilih-sales').value;
            if(!namaPilih) { tampilkanModal("Perhatian", "Silakan pilih nama Anda!"); return; }

            namaSalesAktifGlobal = namaPilih;
            localStorage.setItem('ufo_nama_sales_aktif', namaPilih);
            document.getElementById('panel-login').style.display = 'none';
            document.getElementById('panel-menu-utama').style.display = 'block';
            document.getElementById('label-user-aktif').innerText = namaPilih;
            renderUI();
        }

        function logoutAkun() {
            tampilkanModalKonfirmasi("Logout", "Yakin ingin logout dari perangkat ini?", () => {
                localStorage.removeItem('ufo_nama_sales_aktif');
                namaSalesAktifGlobal = "";
                document.getElementById('panel-login').style.display = 'block';
                document.getElementById('panel-menu-utama').style.display = 'none';
            });
        }

        // ====== AKSI ======
        function aksiHadirKerja() {
            if (statusSistemGlobal !== "BUKA") { tampilkanModal("Antrian Tutup", "Sistem antrian sedang ditutup."); return; }
            if (!posisiSaya.ok) { tampilkanModal("Di Luar Radius", "Anda harus berada di dalam radius toko untuk check-in."); return; }

            const kat = document.getElementById('pilih-kategori-hadir').value;
            const nama = getAkunAktif();
            const clean = sanitizeNama(nama);

            window.dbSet(window.dbRef(window.db, 'antrian/' + clean), {
                nama: nama, status: "Standby", waktuStandby: Date.now(), kategori: kat, subkategori: kat, timerMulai: 0, timerAksi: ""
            }).then(() => {
                localStorage.setItem('ufo_checkin_hari_ini', 'true');
                localStorage.setItem('ufo_checkin_tanggal', getTanggalKey());
                catatAktivitas(nama, "CheckIn", kat);
                renderUI();
            });
        }

        function aksiDaftarAntrianNormal() {
            if (statusSistemGlobal !== "BUKA") { tampilkanModal("Antrian Tutup", "Sistem antrian sedang ditutup."); return; }
            const kat = document.getElementById('pilih-kategori-normal').value;
            const nama = getAkunAktif();
            const clean = sanitizeNama(nama);

            window.dbSet(window.dbRef(window.db, 'antrian/' + clean), {
                nama: nama, status: "Standby", waktuStandby: Date.now(), kategori: kat, subkategori: kat, timerMulai: 0, timerAksi: ""
            }).then(() => catatAktivitas(nama, "DaftarAntrian", kat));
        }

        function aksiUtamaCustomer() {
            const nama = getAkunAktif();
            const clean = sanitizeNama(nama);
            window.dbUpdate(window.dbRef(window.db, 'antrian/' + clean), { status: "Melayani", timerMulai: Date.now(), timerAksi: "Melayani" })
            .then(() => catatAktivitas(nama, "BawaCustomer", ""));
        }

        function aksiToggleMakan() {
            const akun = getAkunAktif();
            const clean = sanitizeNama(akun);
            const itemSaya = daftarAntrianGlobal.find(it => sanitizeNama(it.nama) === clean);
            const statusNow = itemSaya ? itemSaya.status : "";

            if (localStorage.getItem('ufo_sudah_makan_' + clean) === 'true' && statusNow !== "Waktu Makan") {
                tampilkanModal("Perhatian", "Anda sudah menggunakan jatah waktu makan hari ini!");
                return;
            }

            if (statusNow === "Standby") {
                tampilkanModalKonfirmasi("Waktu Makan", "Posisi antrian utama Anda akan dikunci sementara selama waktu makan. Lanjutkan?", () => {
                    localStorage.setItem('ufo_sudah_makan_' + clean, 'true');
                    window.dbUpdate(window.dbRef(window.db, 'antrian/' + clean), {
                        status: "Waktu Makan", timerMulai: Date.now(), timerAksi: "Makan"
                    }).then(() => catatAktivitas(akun, "MulaiMakan", ""));
                });
            } else {
                window.dbUpdate(window.dbRef(window.db, 'antrian/' + clean), {
                    status: "Standby", timerMulai: 0, timerAksi: ""
                }).then(() => catatAktivitas(akun, "SelesaiMakan", ""));
            }
        }

        function aksiSelesaiClosing() {
            document.getElementById('modal-title').innerText = "Hasil Melayani Customer";
            document.getElementById('modal-desc').innerHTML = `
                <div style="text-align:center; margin-bottom: 12px; font-weight: 700;">Customer ini hasilnya apa?</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button type="button" id="btn-pilih-deal" style="background: #059669; color: white; padding: 14px; font-weight: 800; border-radius: 10px; border:none; cursor:pointer;">✓ DEAL / CLOSING</button>
                    <button type="button" id="btn-pilih-lihat" style="background: #d97706; color: white; padding: 14px; font-weight: 800; border-radius: 10px; border:none; cursor:pointer;">◉ LIHAT-LIHAT SAJA</button>
                </div>`;
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-customer" onclick="tutupModal()">Batal</button>`;
            document.getElementById('custom-modal').classList.add('active');

            document.getElementById('btn-pilih-deal').onclick = () => selesaiMelayaniAction("Deal");
            document.getElementById('btn-pilih-lihat').onclick = () => selesaiMelayaniAction("Lihat");
        }

        function selesaiMelayaniAction(hasil) {
            tutupModal();
            const nama = getAkunAktif();
            const clean = sanitizeNama(nama);
            window.dbRemove(window.dbRef(window.db, 'antrian/' + clean))
            .then(() => catatAktivitas(nama, "SelesaiMelayani", hasil));
        }

        function aksiToggleCS() {
            const nama = getAkunAktif();
            const clean = sanitizeNama(nama);
            const itemSaya = daftarAntrianGlobal.find(it => sanitizeNama(it.nama) === clean);
            const statusNow = itemSaya ? itemSaya.status : "";

            if (statusNow === "Standby") {
                window.dbUpdate(window.dbRef(window.db, 'antrian/' + clean), { status: "Dipanggil CS" })
                .then(() => catatAktivitas(nama, "PanggilCS", ""));
            } else {
                window.dbUpdate(window.dbRef(window.db, 'antrian/' + clean), { status: "Standby" })
                .then(() => catatAktivitas(nama, "SelesaiCS", ""));
            }
        }

        function aksiToggleIbadah() {
            const nama = getAkunAktif();
            const clean = sanitizeNama(nama);
            const itemSaya = daftarAntrianGlobal.find(it => sanitizeNama(it.nama) === clean);
            const statusNow = itemSaya ? itemSaya.status : "";

            if (statusNow === "Standby") {
                window.dbUpdate(window.dbRef(window.db, 'antrian/' + clean), { status: "Ibadah", timerMulai: Date.now(), timerAksi: "Ibadah" })
                .then(() => catatAktivitas(nama, "MulaiIbadah", ""));
            } else {
                window.dbUpdate(window.dbRef(window.db, 'antrian/' + clean), { status: "Standby", timerMulai: 0, timerAksi: "" })
                .then(() => catatAktivitas(nama, "SelesaiIbadah", ""));
            }
        }

        function bukaModalKeluarIstirahat() {
            tampilkanModalKonfirmasi("Keluar Antrian", "Yakin ingin keluar dari antrian?", () => {
                const nama = getAkunAktif();
                const clean = sanitizeNama(nama);
                window.dbRemove(window.dbRef(window.db, 'antrian/' + clean))
                .then(() => catatAktivitas(nama, "KeluarAntrian", ""));
            });
        }

        function catatAktivitas(nama, aksi, hasil) {
            window.dbPush(window.dbRef(window.db, 'statistikAktivitas'), {
                nama: nama, aksi: aksi, waktu: Date.now(), tanggal: getTanggalIndo(), hasil: hasil || ""
            });
        }

        // ====== TIMER ======
        function updateTimerAktif(itemSaya) {
            const box = document.getElementById('timer-aktif-box');
            const label = document.getElementById('timer-aktif-label');
            const display = document.getElementById('timer-aktif-display');

            if (!itemSaya || !itemSaya.timerMulai || itemSaya.timerMulai === 0) {
                box.style.display = 'none';
                if (timerIntervalGlobal) { clearInterval(timerIntervalGlobal); timerIntervalGlobal = null; }
                return;
            }

            box.style.display = 'block';
            label.innerText = "TIMER " + (itemSaya.timerAksi || "").toUpperCase();

            const tick = () => {
                const elapsed = Math.floor((Date.now() - itemSaya.timerMulai) / 1000);
                const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const s = String(elapsed % 60).padStart(2, '0');
                display.innerText = `${m}:${s}`;
                // warning > 30 menit untuk makan, > 15 menit untuk ibadah
                const limit = itemSaya.timerAksi === "Makan" ? 1800 : (itemSaya.timerAksi === "Ibadah" ? 900 : 3600);
                if (elapsed > limit) display.classList.add('warning');
                else display.classList.remove('warning');
            };
            if (timerIntervalGlobal) clearInterval(timerIntervalGlobal);
            tick();
            timerIntervalGlobal = setInterval(tick, 1000);
        }

        // ====== RENDER ======
        function renderUI() {
            const badge = document.getElementById('badge-status-sistem');
            badge.innerText = statusSistemGlobal === "BUKA" ? "STATUS ANTRIAN: OPEN" : "STATUS ANTRIAN: CLOSED";
            badge.className = statusSistemGlobal === "BUKA" ? "status-badge-sistem status-open" : "status-badge-sistem status-closed";

            let listHA = "", listAV = "";
            let urutHA = 1, urutAV = 1;
            const akunSaya = sanitizeNama(getAkunAktif());

            const dataStandby = daftarAntrianGlobal.filter(item => item.status === "Standby");
            document.getElementById('promotor-nama-ha').textContent = (dataStandby.find(i => String(i.kategori).toUpperCase() === "HA") || {}).nama || "Belum Ada";
            document.getElementById('promotor-nama-av').textContent = (dataStandby.find(i => String(i.kategori).toUpperCase() === "AV") || {}).nama || "Belum Ada";

            // urutkan standby berdasarkan waktuStandby
            const sorted = [...daftarAntrianGlobal].sort((a,b) => (a.waktuStandby||0) - (b.waktuStandby||0));

            sorted.forEach(item => {
                let kat = String(item.kategori || "HA").toUpperCase();
                let itemHtml = "";
                const isSaya = sanitizeNama(item.nama) === akunSaya;
                const clsSaya = isSaya ? ' class="saya-sendiri"' : '';

                if (item.status === "Standby") {
                    let urut = kat === "HA" ? urutHA++ : urutAV++;
                    let badgeHtml = (urut === 1) ? `<span class="badge-status-item badge-giliran-anda">Giliran Utama</span>` : `<span class="badge-status-item badge-standby">Standby #${urut}</span>`;
                    itemHtml = `<li${clsSaya}><b>${urut}. ${item.nama}${isSaya?' (Anda)':''}</b> ${badgeHtml}</li>`;
                } else if (item.status === "Waktu Makan") {
                    itemHtml = `<li${clsSaya}><b>${item.nama}${isSaya?' (Anda)':''}</b> <span class="badge-status-item badge-makan">Waktu Makan</span></li>`;
                } else if (item.status === "Melayani") {
                    itemHtml = `<li${clsSaya}><b>${item.nama}${isSaya?' (Anda)':''}</b> <span class="badge-status-item badge-melayani">Melayani</span></li>`;
                } else if (item.status === "Dipanggil CS") {
                    itemHtml = `<li${clsSaya}><b>${item.nama}${isSaya?' (Anda)':''}</b> <span class="badge-status-item badge-cs">Dipanggil CS</span></li>`;
                } else if (item.status === "Ibadah") {
                    itemHtml = `<li${clsSaya}><b>${item.nama}${isSaya?' (Anda)':''}</b> <span class="badge-status-item badge-ibadah">Sedang Ibadah</span></li>`;
                }
                if (kat === "HA") listHA += itemHtml;
                else if (kat === "AV") listAV += itemHtml;
            });

            document.getElementById('list-HA').innerHTML = listHA || "<li><i>Belum ada antrian</i></li>";
            document.getElementById('list-AV').innerHTML = listAV || "<li><i>Belum ada antrian</i></li>";

            const itemSaya = daftarAntrianGlobal.find(it => sanitizeNama(it.nama) === akunSaya);
            const statusSaya = itemSaya ? itemSaya.status : "belum_ada";
            const sudahMakan = localStorage.getItem('ufo_sudah_makan_' + akunSaya) === 'true';

            const secCheckin = document.getElementById('section-checkin-awal');
            const secNormal = document.getElementById('section-normal');
            let sudahCheckinToday = localStorage.getItem('ufo_checkin_hari_ini') === 'true' 
                && localStorage.getItem('ufo_checkin_tanggal') === getTanggalKey();

            if (statusSaya !== "belum_ada") {
                secCheckin.style.display = 'none';
                secNormal.style.display = 'block';
            } else if (!sudahCheckinToday) {
                secCheckin.style.display = 'block';
                secNormal.style.display = 'none';
                // init peta setelah section muncul
                setTimeout(initPetaPromotor, 100);
            } else {
                secCheckin.style.display = 'none';
                secNormal.style.display = 'block';
            }

            document.getElementById('group-pilih-kategori-normal').style.display = statusSaya === "belum_ada" ? "block" : "none";
            document.getElementById('btn-daftar-antrian').style.display = statusSaya === "belum_ada" ? "block" : "none";
            document.getElementById('btn-utama-customer').style.display = statusSaya === "Standby" ? "block" : "none";
            document.getElementById('btn-selesai-closing').style.display = statusSaya === "Melayani" ? "block" : "none";
            document.getElementById('btn-utama-cs').style.display = (statusSaya === "Standby" || statusSaya === "Dipanggil CS") ? "block" : "none";
            document.getElementById('btn-utama-ibadah').style.display = (statusSaya === "Standby" || statusSaya === "Ibadah") ? "block" : "none";
            document.getElementById('btn-keluar-istirahat').style.display = (statusSaya === "Standby" || statusSaya === "Dipanggil CS" || statusSaya === "Ibadah") ? "block" : "none";

            const btnMakan = document.getElementById('btn-waktu-makan');
            if (statusSaya === "Standby" || statusSaya === "Waktu Makan") {
                btnMakan.style.display = "block";
                if (statusSaya === "Waktu Makan") {
                    btnMakan.className = "btn-amber btn-gold-pulse";
                    btnMakan.innerText = "SELESAI MAKAN";
                } else if (sudahMakan) {
                    btnMakan.className = "btn-disabled";
                    btnMakan.innerText = "SUDAH MAKAN HARI INI";
                } else {
                    btnMakan.className = "btn-amber";
                    btnMakan.innerText = "WAKTU MAKAN";
                }
            } else {
                btnMakan.style.display = "none";
            }

            // Timer aktif
            updateTimerAktif(itemSaya);
        }

        // ====== DARK MODE ======
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('ufo_dark_mode', document.body.classList.contains('dark-mode'));
            document.getElementById('btn-toggle-dark').innerHTML = document.body.classList.contains('dark-mode') ? '☀️ Terang' : '🌙 Gelap';
        }

        function initDarkMode() {
            if (localStorage.getItem('ufo_dark_mode') === 'true') {
                document.body.classList.add('dark-mode');
                document.getElementById('btn-toggle-dark').innerHTML = '☀️ Terang';
            }
        }

        // ====== MODAL ======
        function tampilkanModal(j, d) {
            document.getElementById('modal-title').innerText = j;
            document.getElementById('modal-desc').innerText = d;
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-customer" onclick="tutupModal()">OK</button>`;
            document.getElementById('custom-modal').classList.add('active');
        }

        function tampilkanModalKonfirmasi(j, d, cb) {
            document.getElementById('modal-title').innerText = j;
            document.getElementById('modal-desc').innerText = d;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" class="btn-customer" onclick="tutupModal()">Batal</button>
                <button type="button" class="btn-customer" id="btn-modal-ya">Ya</button>
            `;
            document.getElementById('custom-modal').classList.add('active');
            document.getElementById('btn-modal-ya').onclick = () => { tutupModal(); cb(); };
        }

        function tutupModal() { document.getElementById('custom-modal').classList.remove('active'); }

        // expose ke global
        window.simpanAkunHP = simpanAkunHP;
        window.aksiHadirKerja = aksiHadirKerja;
        window.aksiDaftarAntrianNormal = aksiDaftarAntrianNormal;
        window.aksiUtamaCustomer = aksiUtamaCustomer;
        window.aksiToggleMakan = aksiToggleMakan;
        window.aksiSelesaiClosing = aksiSelesaiClosing;
        window.aksiToggleCS = aksiToggleCS;
        window.aksiToggleIbadah = aksiToggleIbadah;
        window.bukaModalKeluarIstirahat = bukaModalKeluarIstirahat;
        window.toggleDarkMode = toggleDarkMode;
        window.tutupModal = tutupModal;
        window.logoutAkun = logoutAkun;
    </script>
</body>
</html>
